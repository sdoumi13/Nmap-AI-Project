<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring (network/radar effect) -->
  <circle cx="32" cy="32" r="28" stroke="url(#logoGradient)" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="32" cy="32" r="24" stroke="url(#logoGradient)" stroke-width="1.5" fill="none" opacity="0.2"/>
  <circle cx="32" cy="32" r="20" stroke="url(#logoGradient)" stroke-width="1" fill="none" opacity="0.15"/>
  
  <!-- Central hexagon (network node) -->
  <polygon points="32,12 42,18 42,28 32,34 22,28 22,18" 
           fill="url(#logoGradient)" 
           stroke="#a78bfa" 
           stroke-width="1.5"
           opacity="0.9"/>
  
  <!-- Inner hexagon (AI core) -->
  <polygon points="32,18 38,22 38,28 32,32 26,28 26,22" 
           fill="url(#innerGradient)" 
           stroke="#c4b5fd" 
           stroke-width="1"/>
  
  <!-- Center dot (active node) -->
  <circle cx="32" cy="25" r="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- Scan lines (radar effect) -->
  <line x1="32" y1="32" x2="32" y2="4" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="32" x2="50" y2="20" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="32" x2="50" y2="44" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="32" x2="14" y2="20" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="32" x2="14" y2="44" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Corner accents (cyberpunk style) -->
  <rect x="8" y="8" width="4" height="4" fill="#8b5cf6" opacity="0.6"/>
  <rect x="52" y="8" width="4" height="4" fill="#3b82f6" opacity="0.6"/>
  <rect x="8" y="52" width="4" height="4" fill="#3b82f6" opacity="0.6"/>
  <rect x="52" y="52" width="4" height="4" fill="#8b5cf6" opacity="0.6"/>
</svg>

